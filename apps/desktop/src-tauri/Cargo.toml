[package]
name = "rsetup-desktop"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rsetup-core = { path = "../../../crates/rsetup-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

# The Tauri test runtime is only needed to exercise the production command
# registry through real IPC dispatch, so it stays out of shipped builds.
[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }
