[package]
name = "rsetup-desktop"
version = "0.5.0"
edition = "2024"
# MSRV 1.85 由 make msrv-check 用 1.85.0 工具链验证；默认构建使用当前 stable
# （本地验证 rustc 1.99.1），两者不互相替代。
rust-version = "1.85"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rsetup-core = { path = "../../../crates/rsetup-core" }
serde = { version = "1", features = ["derive"] }
# The privileged install path reads the helper's typed JSON answer, so this is a
# real dependency now and not only a test one. Same version the dev-dependency
# below already pinned in Cargo.lock.
serde_json = "1"
tauri = { version = "2", features = [] }

# The Tauri test runtime is only needed to exercise the production command
# registry through real IPC dispatch, so it stays out of shipped builds.
[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }
