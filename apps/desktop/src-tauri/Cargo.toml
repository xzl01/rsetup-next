[package]
name = "rsetup-desktop"
version = "0.5.0"
edition = "2024"
# The same minimum the workspace declares. Declaring it here keeps the lints
# MSRV-aware, so a suggestion that needs a newer Rust (such as collapsing nested
# `if let` into the 1.88 let-chain syntax) is not made for this crate either.
rust-version = "1.85"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rsetup-core = { path = "../../../crates/rsetup-core" }
serde = { version = "1", features = ["derive"] }
# The privileged install path reads the helper's typed JSON answer, so this is a
# real dependency now and not only a test one. Same version the dev-dependency
# below already pinned in Cargo.lock.
serde_json = "1"
tauri = { version = "2", features = [] }

# The Tauri test runtime is only needed to exercise the production command
# registry through real IPC dispatch, so it stays out of shipped builds.
[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }
