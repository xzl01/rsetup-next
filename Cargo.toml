[workspace]
resolver = "2"
members = [
    "crates/rsetup-core",
    "crates/rsetup-app",
    "crates/rsetup-controller",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/xzl01/rsetup-next"

[workspace.dependencies]
argon2 = "0.5"
hex = "0.4"
rand = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls", "chrono", "uuid"] }
tower = { version = "0.5", features = ["util"] }
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
