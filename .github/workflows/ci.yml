name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject legacy runtime files
        run: |
          test ! -e src/usr/bin/rsetup
          test ! -e src/usr/lib/rsetup
          test ! -e src/usr/lib/librtui
          test ! -e src/usr/share/librtui
          test ! -e externals/librtui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Test browser localization
        run: node --test ui/i18n.test.mjs

  debian-package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-slim
    steps:
      - name: Install packaging tools
        run: >-
          apt-get update &&
          apt-get install -y --no-install-recommends
          build-essential ca-certificates cargo debhelper devscripts dpkg-dev
          git lintian nodejs rustc
      - uses: actions/checkout@v7
      - name: Prepare offline Cargo cache
        run: CARGO_HOME="$GITHUB_WORKSPACE/debian/cargo-home" cargo fetch --locked
      - name: Build Debian package
        run: dpkg-buildpackage --build=binary --no-sign
      - name: Inspect Debian package
        run: |
          dpkg-deb --info ../rsetup-next_*.deb
          dpkg-deb --contents ../rsetup-next_*.deb
          if readelf -d target/release/rsetup-next | grep -q '(NEEDED)'; then
            echo "rsetup-next unexpectedly has dynamic library dependencies"
            exit 1
          fi
          lintian --fail-on error ../rsetup-next_*.changes
      - name: Export Debian package
        run: |
          mkdir -p artifacts
          cp ../rsetup-next_*_${{ matrix.architecture }}.deb artifacts/
      - uses: actions/upload-artifact@v7
        with:
          name: rsetup-next-debian-${{ matrix.architecture }}
          path: artifacts/*.deb
          retention-days: 7

  debian-12-runtime:
    needs: debian-package
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm-slim
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rsetup-next-debian-${{ matrix.architecture }}
          path: artifacts
      - name: Install on Debian 12
        run: |
          apt-get update
          apt-get install -y ./artifacts/rsetup-next_*_${{ matrix.architecture }}.deb
      - name: Smoke test on Debian 12
        run: |
          rsetup-next --demo status --json | grep -q '"identity"'
          rsetup-next --demo actions --json | grep -q '"system.update"'
