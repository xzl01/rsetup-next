name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Reject legacy runtime files
        run: |
          test ! -e src/usr/bin/rsetup
          test ! -e src/usr/lib/rsetup
          test ! -e src/usr/lib/librtui
          test ! -e src/usr/share/librtui
          test ! -e externals/librtui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      # 中控前端产物 `apps/controller-web/dist` 是**生成物，不入库**：Rust 侧的
      # rsetup-controller 在编译期读取这份 dist（build.rs 缺失即 fail-closed），所以任何
      # 编译它的作业都必须先把前端构建出来。本作业按「锁定安装 → 测试 → 类型检查 → 构建」
      # 的顺序跑，顺序与 make controller-test-offline 的前端两条门禁一致；随后
      # `--test web_assets` 读的就是这一步写到磁盘上的字节。产物文件名带 vite 的 hash，
      # 每次都由 vite 决定，仓库与流水线都不写死具体名字。
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/controller-web/package-lock.json
      - name: Install controller web dependencies
        run: npm --prefix apps/controller-web ci
      - name: Test controller web
        run: npm --prefix apps/controller-web test -- --run
      - name: Typecheck controller web
        run: npm --prefix apps/controller-web run typecheck
      - name: Build controller web
        run: npm --prefix apps/controller-web run build
      - name: Check formatting
        run: make fmt-check
      # 规范 §7.8 的五条 grep 静态门禁（make metrics-static-gates）：纯只读检查，
      # 不编译、不联网、不需要 apps/controller-web/dist，所以排在 Rust 编译之前，
      # 与 fmt-check 同属静态轨道，失败时不必等编译就能定位。
      # 注意不要改成完整的 metrics-gates 目标：它会重复下面的 clippy/cargo test
      # 并触发编译。该接线由 scripts/tests/controller-ci-contract.test.mjs 钉住。
      - name: Check metrics static gates
        run: make metrics-static-gates
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace
      # 单独再跑一次资源测试，让「嵌入资源交付」在 CI 里有独立可见的用例。
      - name: Test controller embedded web assets
        run: cargo test -p rsetup-controller --test web_assets --locked
      # The pinned deviceinfo crate is excluded from our workspace, so the
      # workspace commands above never compile or test it, even though it owns
      # the system/thermal/storage sampling and the difference logic.
      - name: Test pinned deviceinfo
        run: cargo test --manifest-path externals/devicesinfo/Cargo.toml -p deviceinfo --locked
        env:
          CARGO_TARGET_DIR: target/deviceinfo-check
      - name: Test native EFI Overlay validation
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler
          cargo test -p rsetup-core native_fdtoverlay_validation_and_apply --locked -- --ignored
      - name: Test bounded mirror transfers
        run: cargo test -p rsetup-core curl_benchmark_fixture --locked -- --ignored
      - name: Test browser localization and async handlers
        run: node --test ui/*.test.mjs
      # 配置合同：钉住 make controller-test-offline 目标与本作业里「前端构建
      # 先于 --test web_assets」的顺序——本作业被自己的合同检查，改坏接线即红。
      - name: Test CI configuration contracts
        run: node --test scripts/tests/*.test.mjs
      # 中控验收账本（docs/testing/controller-v1-acceptance.md）的合同校验：只验报告
      # 格式与行完整性（ID 集合、状态取值、PASS 行必填字段），不证明外部证据真实。
      - name: Check controller acceptance ledger
        run: python3 scripts/check_controller_acceptance.py docs/testing/controller-v1-acceptance.md

  # 架构口径：本项目仅维护 64 位目标 aarch64（arm64）与 x86_64（amd64），
  # 与 debian/control 的 `Architecture: amd64 arm64` 保持一致。
  rust-multi-arch-check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 矩阵恰好为下列两项：aarch64-unknown-linux-gnu(arm64) 与
        # x86_64-unknown-linux-gnu(amd64)。32 位目标（armv7/i686 等）不再纳入
        # 多架构检查，请勿加回；该口径由 scripts/tests/controller-ci-contract.test.mjs 钉住。
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation toolchain for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      # 交叉 --check 同样要编译 rsetup-controller，而它编译期读取的
      # apps/controller-web/dist 是不入库的生成物，必须先在本作业里构建出来。
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/controller-web/package-lock.json
      - name: Build controller web assets
        run: |
          npm --prefix apps/controller-web ci
          npm --prefix apps/controller-web run build
      - name: Check workspace across target architectures
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  # apps/desktop/src-tauri is listed in Cargo.toml's `workspace.exclude`, so no
  # other job here ever compiles it: the workspace commands skip it and the
  # Debian job never installs WebKitGTK. Build and test it explicitly with the
  # Linux Tauri stack, so the Tauri IPC regression tests run in CI instead of
  # only on a developer machine.
  desktop-tauri-ipc:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: target/desktop-ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libglib2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      # `make desktop-test` runs this same command locally.
      - name: Test Tauri IPC commands
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Check rsetup-desktop formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      # `make desktop-check` runs the formatting and lint commands locally.
      - name: Lint rsetup-desktop
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

  debian-package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-slim
    steps:
      - name: Install packaging tools
        run: >-
          apt-get update &&
          apt-get install -y --no-install-recommends
          build-essential ca-certificates cargo curl debhelper devscripts dpkg-dev
          git lintian nodejs npm rustc
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # 根因（CI run 40109395224）：Debian trixie 的 apt rustc/cargo 版本低于源码所需
      # 下限——let-chains（issue #53667）与 slice_as_chunks（issue #74985）都在 1.88.0
      # 才稳定，用 trixie 打包的 apt rustc 编译 rsetup-core 会刷 27 条 E0658，arm64 直接
      # 失败、amd64 同源。Trixie 主仓没有不低于 1.88 的 rustc 可依赖，故与其余 Rust 作业
      # 同口径：在同一个 Trixie 容器里**显式**装一支 stable 工具链，让 debian/rules 里裸
      # `cargo` 解析到它（rustup 的 bin 目录经 GITHUB_PATH 排到 apt 的 /usr/bin 之前），
      # 而不是换基础镜像、跳过打包/测试，或把 stable 降级到不兼容版本。apt 的 cargo/rustc
      # 仍留在上面的安装清单里，只用于满足 Build-Depends 的存在性检查，不再充当实际构建
      # 编译器。本步骤排在离线缓存预热与 dpkg-buildpackage 之前，保证 cargo fetch 与打包
      # 编译共用同一支 stable。同一清单还必须带 curl：CI run 40119249655 里 trixie-slim
      # 容器没有 curl 命令（只有 apt 自用的 libcurl4 共享库），rust-toolchain 的
      # 「Install rustup if needed」子步骤用 curl 拉 sh.rustup.rs 直接 exit 127；TLS 信任
      # 库 ca-certificates 同理是 rustup/cargo/npm https 下载的引导前置。curl 与
      # ca-certificates 都只属 CI 容器引导，不是业务依赖，不进 debian/control。上述清单
      # 与「安装早于 @stable」的口径由 scripts/tests/controller-ci-contract.test.mjs 钉住。
      # 本仓统一以 stable 管理 Rust 版本、不在构建配置里钉死具体
      # 版本号，这里也只装 stable：let-chains 与 slice_as_chunks 自 1.88.0 起就是 stable
      # 的固定能力，stable 恒满足，无需在本仓写死某个具体版本。
      - uses: dtolnay/rust-toolchain@stable
      # 前端产物 apps/controller-web/dist 不入库，而 debian/rules 的
      # override_dh_auto_build 会在 cargo 之前用 npm 现生成它
      # （crates/rsetup-controller/build.rs 编译期读取该目录，缺失即失败关闭）。本作业先
      # 显式跑一遍同样的两条命令作为双保险：安装或构建失败时先在作业日志里单独可见，
      # 之后再由 dpkg-buildpackage 走 rules 里的同一条链路。npm 与 nodejs 都是
      # Build-Depends（见 debian/control），与本行的安装一致。
      - name: Build controller web assets
        run: |
          npm --prefix apps/controller-web ci
          npm --prefix apps/controller-web run build
      # 这条边界由 scripts/tests/controller-ci-contract.test.mjs 钉住：每条编译
      # rsetup-controller 的作业——包括走 dpkg-buildpackage 的本作业——都必须先把前端
      # 构建出来（本作业的兜底是 debian/rules 里那两条 npm 命令）。
      - name: Prepare offline Cargo cache
        run: CARGO_HOME="$GITHUB_WORKSPACE/debian/cargo-home" cargo fetch --locked
      - name: Build Debian package
        run: dpkg-buildpackage --build=binary --no-sign
      - name: Inspect Debian package
        run: |
          dpkg-deb --info ../rsetup-next_*.deb
          dpkg-deb --contents ../rsetup-next_*.deb
          dpkg-deb --info ../rsetup-controller_*.deb
          dpkg-deb --contents ../rsetup-controller_*.deb
          dpkg-deb --info ../rsetup-board-agent_*.deb
          dpkg-deb --contents ../rsetup-board-agent_*.deb
          if readelf -d target/release/rsetup-next | grep -q '(NEEDED)'; then
            echo "rsetup-next unexpectedly has dynamic library dependencies"
            exit 1
          fi
          if readelf -d target/release/rsetup-next-helper | grep -q '(NEEDED)'; then
            echo "rsetup-next-helper unexpectedly has dynamic library dependencies"
            exit 1
          fi
          if readelf -d target/release/rsetup-controller | grep -q '(NEEDED)'; then
            echo "rsetup-controller unexpectedly has dynamic library dependencies"
            exit 1
          fi
          if readelf -d target/release/rsetup-controller-migrate | grep -q '(NEEDED)'; then
            echo "rsetup-controller-migrate unexpectedly has dynamic library dependencies"
            exit 1
          fi
          if readelf -d target/release/rsetup-admin | grep -q '(NEEDED)'; then
            echo "rsetup-admin unexpectedly has dynamic library dependencies"
            exit 1
          fi
          if readelf -d target/release/rsetup-board-agent | grep -q '(NEEDED)'; then
            echo "rsetup-board-agent unexpectedly has dynamic library dependencies"
            exit 1
          fi
          lintian --fail-on error ../*.changes
      # 只读断言（不改动产物）：维护脚本必须**逐字**等于「仓库源维护脚本 + 已登记的
      # debhelper 自动片段」，且片段来源、所在脚本种类与单元集合都在白名单内。判定方式是
      # **严格模板匹配**，不是 shell 解释：不建 AST、不算条件真值与可达性，因此不提供
      # 「这段 shell 运行时会怎样」的语义证明，只提供一条更强的静态事实——模板外的任何
      # 字节变化（多一条命令、移动 guard、换单元、改注释、没登记过的 helper 或版本）都判红。
      # 为什么从「解释 shell」收缩到「匹配模板」，以及前三轮各自的绕过，见
      # docs/testing/tunnel-packaging-fix-report.md。
      #
      # 口径与 debian/rules 的 override_dh_installsystemd 一致：三包 --no-start +
      # --no-stop-on-upgrade；controller 与 board-agent 另带 --no-enable。模板表只登记
      # debhelper **13.24.2**（= 本作业镜像 debian:trixie-slim 的实际版本）的上游原文，
      # **不做 >= 放宽**：将来换版本或换 helper 时这里必须变红，先人工核对上游原文再登记。
      #
      # 生命周期承诺如何被结构保证：登记表里唯一会调用 deb-systemd-invoke 的形状只允许
      # 出现在 prerm，因此 postinst/postrm 通过门禁即意味着其文本里没有任何服务激活调用，
      # 「安装/升级不 start/restart/stop」是该条的推论；purge 记账与 remove 后的
      # daemon-reload 都不激活服务。正常 remove 允许 stop，但 13.24.2 在 --no-start
      # --no-stop-on-upgrade 下**不生成任何 prerm 片段**（见下面 preinst/prerm 必须不存在），
      # 而 debhelper 14.5 的真实 prerm-systemd 是**不带 $1 守卫**的 stop，与本承诺冲突，
      # 故意不登记（真到那天由人决定改 rules 还是改承诺）。
      #
      # 静态门禁不证明运行行为：安装/升级不激活服务、enable 符号链接真的建立或不建立，
      # 属动态证据，由下面的 debian-12-runtime 作业（Bookworm 真实 dpkg 安装 +
      # policy-rc.d 动作记录 + test -L / test ! -e 链接断言）提供，两个通道各自如实声明。
      #
      # 末尾钉住 controller 单元的 StateDirectoryMode=0700 与 UMask=0077：状态目录与进程新建
      # 文件的默认权限属交付契约，不随 systemd 默认值漂移。
      # 显式 shell: bash：container 作业的默认 shell 是 `sh -e {0}`（GitHub Actions 对
      # container 作业不注入 bash），而本步骤用了 POSIX sh 没有的 here-string `<<<`。
      # 判据只取 `<<<`：Trixie 的 dash 带 Debian 补丁、支持 set -o pipefail，用「本机旧
      # dash 不认 pipefail」外推 Trixie 的行为不构成依据，所以也不把 pipefail 当 bashism
      # 触发条件（合同同口径，见 scripts/tests/controller-ci-contract.test.mjs）。
      - name: Assert Debian systemd maintainer scripts
        shell: bash
        run: |
          set -euo pipefail
          for pkg in rsetup-next rsetup-controller rsetup-board-agent; do
            line="$(grep -E "dh_installsystemd -p${pkg}( |\$)" debian/rules)"
            grep -q -- '--no-start' <<<"$line" || {
              echo "debian/rules 里 $pkg 的 dh_installsystemd 缺 --no-start"
              exit 1
            }
          done
          for pkg in rsetup-controller rsetup-board-agent; do
            line="$(grep -E "dh_installsystemd -p${pkg}( |\$)" debian/rules)"
            grep -q -- '--no-enable' <<<"$line" || {
              echo "debian/rules 里 $pkg 的 dh_installsystemd 缺 --no-enable"
              exit 1
            }
          done
          if grep -E "dh_installsystemd -prsetup-next( |\$)" debian/rules | grep -q -- '--no-enable'; then
            echo 'rsetup-next 不得带 --no-enable：热策略/风扇曲线/LED 单元必须随包 enable（板卡热安全）'
            exit 1
          fi
          echo 'ok: debian/rules 三个 dh_installsystemd 调用的生命周期口径符合预期'
          tmp="$(mktemp -d)"
          for pkg in rsetup-next rsetup-controller rsetup-board-agent; do
            deb="$(ls "../${pkg}"_*_"${{ matrix.architecture }}".deb | head -n1)"
            dpkg-deb --control "$deb" "$tmp/$pkg"
          done
          # 13.24.2 + --no-start --no-stop-on-upgrade 不生成 preinst/prerm：「升级不 stop」
          # 就体现在这两个脚本**不存在**上。工具链若开始生成，这里必须变红重新审查，
          # 而不是把断言改成「存在也行」。
          for pkg in rsetup-next rsetup-controller rsetup-board-agent; do
            for kind in preinst prerm; do
              if [ -e "$tmp/$pkg/$kind" ]; then
                echo "$pkg 生成了 $kind：--no-start --no-stop-on-upgrade 下不该有这个脚本"
                exit 1
              fi
            done
          done
          echo 'ok: 三个包都没有 preinst/prerm（安装/升级/移除路径不 stop 服务）'
          # 逐包 × 逐脚本调用严格模板门禁：--package / --script-kind / --mode /
          # --source-script 与被审计文件路径一一对应，模板参数位上的单元必须正是本条命令
          # 声明的 --require-unit（拿别的包或别的脚本冒充、把单元只写进注释、少一个单元
          # 都过不了）。--source-script 指向该脚本的仓库源；board-agent 没有源脚本，
          # 其产物是 debhelper 纯生成脚本，门禁只允许 #!/bin/sh + set -e 骨架。
          gate="scripts/lib/systemd-maintainer-audit.mjs"
          node "$gate" --package rsetup-next --script-kind postinst --mode default-enable \
            --source-script debian/postinst \
            --require-unit rsetup-next-thermal-policy.service \
            --require-unit rsetup-next-fan-curve.service \
            --require-unit rsetup-next-led-state.service \
            "$tmp/rsetup-next/postinst"
          node "$gate" --package rsetup-next --script-kind postrm --mode default-enable \
            --require-unit rsetup-next-thermal-policy.service \
            --require-unit rsetup-next-fan-curve.service \
            --require-unit rsetup-next-led-state.service \
            "$tmp/rsetup-next/postrm"
          node "$gate" --package rsetup-controller --script-kind postinst --mode no-enable \
            --source-script debian/rsetup-controller.postinst \
            --require-unit rsetup-controller.service \
            "$tmp/rsetup-controller/postinst"
          node "$gate" --package rsetup-controller --script-kind postrm --mode no-enable \
            --require-unit rsetup-controller.service \
            "$tmp/rsetup-controller/postrm"
          node "$gate" --package rsetup-board-agent --script-kind postinst --mode no-enable \
            --require-unit rsetup-board-agent.service \
            "$tmp/rsetup-board-agent/postinst"
          node "$gate" --package rsetup-board-agent --script-kind postrm --mode no-enable \
            --require-unit rsetup-board-agent.service \
            "$tmp/rsetup-board-agent/postrm"
          echo 'ok: 六个维护脚本全部逐字匹配已登记的 13.24.2 模板（无模板外内容、无服务激活调用）'
          unit="$(dpkg-deb --fsys-tarfile "$(ls ../rsetup-controller_*_"${{ matrix.architecture }}".deb | head -n1)" \
            | tar -xO ./usr/lib/systemd/system/rsetup-controller.service)"
          grep -qx 'StateDirectoryMode=0700' <<<"$unit" || {
            echo 'rsetup-controller.service 缺 StateDirectoryMode=0700'
            exit 1
          }
          grep -qx 'UMask=0077' <<<"$unit" || {
            echo 'rsetup-controller.service 缺 UMask=0077'
            exit 1
          }
          echo 'ok: rsetup-controller.service 带 StateDirectoryMode=0700 与 UMask=0077'
      - name: Export Debian package
        run: |
          mkdir -p artifacts
          cp ../rsetup-next_*_${{ matrix.architecture }}.deb artifacts/
          cp ../rsetup-controller_*_${{ matrix.architecture }}.deb artifacts/
          cp ../rsetup-board-agent_*_${{ matrix.architecture }}.deb artifacts/
      - uses: actions/upload-artifact@v7
        with:
          name: rsetup-next-debian-${{ matrix.architecture }}
          path: artifacts/*.deb
          retention-days: 7

  debian-12-runtime:
    needs: debian-package
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm-slim
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rsetup-next-debian-${{ matrix.architecture }}
          path: artifacts
      - name: Configure recording policy-rc.d
        run: |
          # 只在此一次性容器中替换抑制器；记录请求，不执行任何服务动作。
          cat > /usr/sbin/policy-rc.d <<'RSETUP_POLICY_EOF'
          #!/bin/sh
          log="${RSETUP_POLICY_LOG:-/var/log/rsetup-package-policy.log}"
          {
            printf '%s\t%s' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${RSETUP_PACKAGE_PHASE:-unknown}"
            printf '\t%s' "$@"
            printf '\n'
          } >> "$log"
          exit 101
          RSETUP_POLICY_EOF
          chmod 0755 /usr/sbin/policy-rc.d
          : > /var/log/rsetup-package-policy.log
      - name: Install on Debian 12
        env:
          RSETUP_POLICY_LOG: /var/log/rsetup-package-policy.log
          RSETUP_PACKAGE_PHASE: install
        run: |
          printf '%s\tinstall-begin\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$RSETUP_POLICY_LOG"
          apt-get update
          apt-get install -y ./artifacts/rsetup-next_*_${{ matrix.architecture }}.deb ./artifacts/rsetup-controller_*_${{ matrix.architecture }}.deb ./artifacts/rsetup-board-agent_*_${{ matrix.architecture }}.deb
          printf '%s\tinstall-end\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$RSETUP_POLICY_LOG"
      - name: Smoke test on Debian 12
        run: |
          rsetup-next --demo status --json | grep -q '"identity"'
          rsetup-next --demo actions --json | grep -q '"system.update"'
          rsetup-next --demo sources benchmark --mirror official --json | grep -q 'bytesPerSecond'
          test -x /usr/libexec/rsetup-next-helper
          test -f /usr/share/polkit-1/actions/com.radxa.rsetup-next.policy
          test -f /usr/lib/systemd/system/rsetup-next-thermal-policy.service
          /usr/libexec/rsetup-next-helper action system.inspect --confirmed | grep -q '"actionId":"system.inspect"'
          test -x /usr/bin/rsetup-controller
          test -x /usr/bin/rsetup-controller-migrate
          test -x /usr/bin/rsetup-admin
          test -x /usr/bin/rsetup-board-agent
          test -f /usr/lib/systemd/system/rsetup-board-agent.service
          test -f /usr/lib/systemd/system/rsetup-controller.service
          test -f /usr/share/doc/rsetup-controller/rsetup-controller.default
          test ! -e /etc/default/rsetup-controller
          /usr/bin/rsetup-controller-migrate --help | grep -q "rsetup-controller-migrate"
          /usr/bin/rsetup-admin --help | grep -q "rsetup-admin"
          /usr/bin/rsetup-board-agent --help | grep -q "rsetup-board-agent"
          # C1：证明 debian/rules 的 override_dh_installsystemd 里
          # `dh_installsystemd -prsetup-next --no-start --no-stop-on-upgrade` 这一路真的
          # 生效。override 会替掉整个 helper 的默认调用（dh 不为被省略的包回落默认序列），
          # 少写一行 rsetup-next 就完全没有 enable 记账，板卡重启后热策略/风扇曲线/LED
          # 单元不再随多用户目标启动。rsetup-next 的三个单元按默认口径随包 enable，
          # 装包后 /etc/systemd/system/multi-user.target.wants/ 下必有指向单元文件的
          # 符号链接；debhelper 的 enable 片段走 deb-systemd-helper 直接写符号链接
          # （不像 start 那样经 deb-systemd-invoke，后者会被镜像里的 policy-rc.d=101
          # 整体跳过），所以容器里没有跑起的 systemd 也能用 test -L 断言。
          # 反向断言同一步就地完成：controller 与 board-agent 带 --no-enable，
          # 装包后必须继续没有任何 enable 符号链接。
          for unit in rsetup-next-thermal-policy rsetup-next-fan-curve rsetup-next-led-state; do
            link="/etc/systemd/system/multi-user.target.wants/${unit}.service"
            test -L "$link" || {
              echo "缺少 enable 符号链接：$link（dh_installsystemd -prsetup-next 未生效？）"
              exit 1
            }
            echo "ok: 已随包 enable $unit.service"
          done
          for unit in rsetup-controller rsetup-board-agent; do
            link="/etc/systemd/system/multi-user.target.wants/${unit}.service"
            test ! -e "$link" || {
              echo "不该出现 enable 符号链接：$link（--no-enable 未生效？）"
              exit 1
            }
            echo "ok: 未随包 enable $unit.service"
          done
      - name: Report package service action log
        if: always()
        run: |
          test -f /var/log/rsetup-package-policy.log
          cat /var/log/rsetup-package-policy.log
