version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Every job resolves the toolchain through this action's `stable` ref, and
      # the workspace declares no rust-version: newer compilers arrive via the
      # stable channel itself, so an action bump would only swap the installer.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # crossterm must stay on the version ratatui 0.29 is built against;
      # bumping it alone compiles two crossterm versions.
      - dependency-name: crossterm
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
